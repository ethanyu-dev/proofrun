name: CI
on:
  # 分支变更通过 PR 检查；main 推送验证合并结果，避免 PR 分支重复触发。
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: proofrun-ci-isolated
          POSTGRES_DB: proofrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proofrun"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      # Action 自身使用 Node 24；项目运行版本仍由 .node-version 决定。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # 测试进程泄漏连接时尽早失败并保留日志，避免耗尽整个 check 的 30 分钟预算。
      - run: pnpm test:api
        timeout-minutes: 5
        env:
          PROOFRUN_TEST_DATABASE_URL: postgresql://postgres:proofrun-ci-isolated@127.0.0.1:5432/proofrun
      - run: pnpm test:agent:integration
        env:
          PROOFRUN_TEST_DATABASE_URL: postgresql://postgres:proofrun-ci-isolated@127.0.0.1:5432/proofrun
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: pnpm build
      # 通过真实代理访问编译产物，验证路由、迁移及重启；不代替目标 VM 验收。
      - run: pnpm test:deploy
      - name: 节点安装器边界回归
        run: |
          bash -n scripts/node-release/install.sh
          python3 -m unittest discover -s tests/node-release -p 'test_*.py'

  linux-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 下载固定版本的 Linux 原生引擎并校验摘要
        run: node scripts/download-test-engine.mjs x64 .proofrun/bin/agent-browser-linux-x64
      # 用真实临时数据库验证初始化竞态，不连接生产数据库。
      - name: PostgreSQL 正式实例就绪回归
        run: node --test tests/control-plane/postgres-readiness.test.mjs
      # 写入只发生于临时回环页面；模型为脚本夹具，不证明供应商质量或生产部署通过。
      - name: Linux 浏览器、人工介入与故障回归
        run: pnpm test:agent:linux
        env:
          PROOFRUN_TEST_AGENT_BROWSER: ${{ github.workspace }}/.proofrun/bin/agent-browser-linux-x64
          PROOFRUN_TEST_FULL_LINUX: 'true'
      # 使用同一业务判定器，但模型固定为脚本；没有供应商凭据也能阻止链路回归。
      - name: 业务测评链路冒烟
        run: pnpm test:e2e:linux
        env:
          PROOFRUN_TEST_AGENT_BROWSER: ${{ github.workspace }}/.proofrun/bin/agent-browser-linux-x64
          PROOFRUN_TEST_SKIP_IMAGE_BUILD: 'true'
          PROOFRUN_EVAL_OUTPUT: ${{ runner.temp }}/proofrun-evaluation
      - name: 保存测评材料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-scripted
          path: ${{ runner.temp }}/proofrun-evaluation
          if-no-files-found: ignore
          retention-days: 7

  railway-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node --test tests/railway/watch-paths.test.mjs tests/railway/api-entry.test.mjs
      - run: docker build -f deploy/railway/Dockerfile.api -t proofrun-railway-api:test .
      - run: docker build -f deploy/railway/Dockerfile.web -t proofrun-railway-web:test .
      - run: docker build -f deploy/railway/Dockerfile.agent -t proofrun-railway-agent:test .
      - run: node --test tests/railway/smoke.test.mjs
