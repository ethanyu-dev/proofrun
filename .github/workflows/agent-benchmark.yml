name: Agent Loop Benchmark
on:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      release_version:
        description: 本次候选发布版本（留空使用 CI 提交身份）
        type: string
        required: false

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 固定完整套件，任何失败退出码都会阻止依赖本工作的发布。
      - run: pnpm benchmark:agent
        env:
          PROOFRUN_RELEASE_VERSION: ${{ inputs.release_version || format('ci-{0}', github.sha) }}
      - run: pnpm test:benchmark
      - name: 保存逐轮上下文与失败材料
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-loop-benchmark
          path: .proofrun/benchmarks/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
