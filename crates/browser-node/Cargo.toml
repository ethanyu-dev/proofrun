[package]
name = "proofrun-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "signal", "net", "fs"] }
tokio-util = { version = "0.7.19", features = ["rt", "codec", "io"] }
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
jsonschema = { version = "0.57.0", default-features = false }
fs2 = "0.4"
regress = "0.12"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.9"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }

[build-dependencies]
typify = "0.8.0"
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
